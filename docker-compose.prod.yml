# ReportLift Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
# 1. Generate TLS certificates (see scripts/generate-certs.sh)
# 2. Set required environment variables (see .env.example)
# 3. Set ENCRYPTION_KEY for credential encryption

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-8}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount TLS certificates
      - ./certs:/etc/nginx/certs:ro
      # Use production nginx config
      - ./frontend/nginx.conf.prod:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TLS_CERT_PATH=/etc/nginx/certs/cert.pem
      - TLS_KEY_PATH=/etc/nginx/certs/key.pem
    restart: unless-stopped

networks:
  default:
    name: reportlift-network
